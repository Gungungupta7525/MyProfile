  </g>

  <!-- Placeholder nodes -->
  <g fill="#111823" stroke="url(#edge)" stroke-width="2">
    <rect x="80"  y="260" width="180" height="80" rx="12"/>
    <rect x="330" y="260" width="180" height="80" rx="12"/>
    <rect x="580" y="140" width="180" height="80" rx="12"/>
    <rect x="580" y="380" width="180" height="80" rx="12"/>
    <rect x="850" y="260" width="180" height="80" rx="12"/>
  </g>

  <g fill="#64748b" font-family="ui-monospace, JetBrains Mono, Menlo, monospace"
