    <text x="170" y="300">client</text>
    <text x="170" y="320" font-size="12" opacity="0.6">—</text>
    <text x="420" y="300">api</text>
    <text x="420" y="320" font-size="12" opacity="0.6">—</text>
    <text x="670" y="180">service</text>
    <text x="670" y="200" font-size="12" opacity="0.6">—</text>
    <text x="670" y="420">service</text>
    <text x="670" y="440" font-size="12" opacity="0.6">—</text>
    <text x="940" y="300">store</text>
    <text x="940" y="320" font-size="12" opacity="0.6">—</text>
  </g>

  <g stroke="url(#edge)" stroke-width="2" fill="none" opacity="0.75">
    <path d="M260 300h70"/>
    <path d="M510 300h40c25 0 25-120 50-120"/>
    <path d="M510 300h40c25 0 25 120 50 120"/>
    <path d="M760 180h50c25 0 25 120 40 120"/>
